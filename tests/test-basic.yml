name: Test basic usage - update android manifest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture manifest to workspace
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/damienaicheh--update-android-manifest-package-action/v1.0.0/tests/fixtures/AndroidManifest.xml \
             $GITHUB_WORKSPACE/AndroidManifest.xml

      - id: action
        uses: .
        with:
          android-manifest-path: ./AndroidManifest.xml
          package-name: com.example.newpackage
          app-name: MyNewApp

      - name: Assert package name was updated
        run: |
          CONTENT=$(cat $GITHUB_WORKSPACE/AndroidManifest.xml)
          echo "Manifest content:"
          echo "$CONTENT"
          if echo "$CONTENT" | grep -q 'com.example.newpackage'; then
            echo "PASS: package name updated correctly"
          else
            echo "FAIL: package name was not updated to com.example.newpackage"
            exit 1
          fi

      - name: Assert app name was updated
        run: |
          CONTENT=$(cat $GITHUB_WORKSPACE/AndroidManifest.xml)
          if echo "$CONTENT" | grep -q 'MyNewApp'; then
            echo "PASS: app name updated correctly"
          else
            echo "FAIL: app name was not updated to MyNewApp"
            exit 1
          fi

      - name: Assert old package name is gone
        run: |
          CONTENT=$(cat $GITHUB_WORKSPACE/AndroidManifest.xml)
          if echo "$CONTENT" | grep -q 'com.example.oldpackage'; then
            echo "FAIL: old package name still present"
            exit 1
          else
            echo "PASS: old package name removed"
          fi
