name: Test basic usage - update package and app name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare AndroidManifest.xml
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/AndroidManifest.xml" \
             "$GITHUB_WORKSPACE/AndroidManifest-test.xml"

      - id: action
        uses: .
        with:
          android-manifest-path: AndroidManifest-test.xml
          package-name: com.mycompany.myapp
          app-name: MyApp

      - name: Assert package name was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/AndroidManifest-test.xml")
          echo "File content:"
          echo "$CONTENT"
          if echo "$CONTENT" | grep -q 'package="com.mycompany.myapp"'; then
            echo "PASS: package name updated correctly"
          else
            echo "FAIL: package name was not updated to 'com.mycompany.myapp'"
            exit 1
          fi

      - name: Assert app name was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/AndroidManifest-test.xml")
          if echo "$CONTENT" | grep -q 'android:label="MyApp"'; then
            echo "PASS: app name updated correctly"
          else
            echo "FAIL: app name was not updated to 'MyApp'"
            exit 1
          fi

      - name: Assert old package name is gone
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/AndroidManifest-test.xml")
          if echo "$CONTENT" | grep -q 'package="com.example.app"'; then
            echo "FAIL: old package name 'com.example.app' still present"
            exit 1
          else
            echo "PASS: old package name is no longer present"
          fi
