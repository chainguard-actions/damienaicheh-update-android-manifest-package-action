name: Test error handling - missing manifest file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          android-manifest-path: /nonexistent/path/AndroidManifest.xml
          package-name: com.test.app
          app-name: TestApp

      - name: Assert action failed gracefully for missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when manifest file does not exist"
          else
            echo "FAIL: expected action to fail for missing manifest, but got outcome '$OUTCOME'"
            exit 1
          fi
